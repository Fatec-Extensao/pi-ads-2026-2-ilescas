<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login de Administrador</title>
  </head>
  <body>
    <!-- Descrição -->
    <main>
      <header>
        <h1>Login de Administrador</h1>
        <a href="../main.html">← Voltar à página principal</a>
        <p>Faça login para acessar a área administrativa.</p>
      </header>
    </main>

    <!-- Seção inserir credenciais -->
    <section id="Inserir Credenciais">
      <h2>Fazer Login do Administrador</h2>
      <form action="admin-dashboard.html" method="get">
        <p>Digite o usuário:</p>
        <input type="text" name="usuario" placeholder="Usuário" required />
        <p>Digite a senha:</p>
        <input type="password" name="senha" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
    </section>

    <footer>
      <p>Gustavo Martins da Silva Ilescas</p>
      <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
